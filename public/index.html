<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管家</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <svg class="bear-mascot" viewBox="0 0 100 100" width="36" height="36" aria-hidden="true">
          <circle class="bear-ear" cx="22" cy="20" r="14" />
          <circle class="bear-ear" cx="78" cy="20" r="14" />
          <circle class="bear-head" cx="50" cy="55" r="38" />
          <ellipse class="bear-snout" cx="50" cy="65" rx="20" ry="16" />
          <circle class="bear-eye" cx="38" cy="50" r="4" />
          <circle class="bear-eye" cx="62" cy="50" r="4" />
          <circle class="bear-nose" cx="50" cy="62" r="4" />
          <path class="bear-mouth" d="M42 72 Q50 78 58 72" />
        </svg>
        <h1>管家</h1>
      </div>
      <a class="nav-link" href="/budget.html">記帳</a>
    </header>

    <main id="chat" class="chat"></main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="chat-input"
        placeholder="輸入訊息，按 Enter 送出（Shift+Enter 換行）"
        rows="1"
        autofocus
      ></textarea>
      <button id="send-btn" type="submit">送出</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
